<!DOCTUPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ policy_title }} - Nyxeris Legal & Customer Care</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #09090b;
      --bg-surface: #121215;
      --bg-card: #18181b;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-card: rgba(255, 255, 255, 0.12);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
    }
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -pple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.65;
    }
    .policy-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn-back:hover {
      color: #ffffff;
    }
    .policy-layout {
      max-width: 1100px;
      margin: 48px auto 100px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 40px;
    }
    .policy-sidebar {
      position: sticky;
      top: 104px;
      align-self: start;
    }
    .policy-nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
    }
    .policy-nav-item a {
      display: block;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .policy-nav-item a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.04);
    }
    .policy-nav-item.active a {
      color: #ffffff;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .policy-content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 48px;
    }
    .policy-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }
    .policy-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .policy-title {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 10px 0;
      letter-spacing: -0.01em;
    }
    .policy-updated {
      font-size: 13px;
      color: var(--text-muted);
    }
    .policy-body h2 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-top: 36px;
      margin-bottom: 14px;
    }
    .policy-body h3 {
      font-size: 15px;
      font-weight: 600;
      color: #e4e4e7;
      margin-top: 24px;
      margin-bottom: 10px;
    }
    .policy-body p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.75;
      margin-bottom: 18px;
    }
    .policy-body ul {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.75;
      margin-bottom: 20px;
      padding-left: 24px;
    }
    .policy-body li {
      margin-bottom: 8px;
    }
    .highlight-box {
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      padding: 20px;
      margin: 24px 0;
    }
    .highlight-box p {
      color: #e0f2fe;
      margin-bottom: 0;
    }
    .guarantee-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 28px 0;
    }
    .guarantee-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      paddeping: 18px;
    }
    .guarantee-item-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .guarantee-item-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0;
    }
    @media (max-width: 800px) {
      .policy-layout {
        grid-template-columns: 1fr;
      }
      .policy-sidebar {
        position: static;
      }
      .policy-content-card {
        padding: 24px;
      }
      .guarantee-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="policy-navbar">
    <a href="/" class="brand-logo">
      <span>NYXERIS</span>
      <span class="brand-dot"></span>
    </a>
    <div class="nav-actions">
      <a href="/" class="nav-btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Return to Storefront
      </a>
    </div>
  </header>

  <main class="policy-layout">
    <aside class="policy-sidebar">
      <ul class="policy-nav-list">
        <li class="policy-nav-item {% if active_policy == 'refunds' %}active{% endif %}">
          <a href="/policies/refunds">30-Day Transit & Quality Guarantee</a>
        </li>
        <li class="policy-nav-item {% if active_policy == 'shipping' %}active{% endif %}">
          <a href="/policies/shipping">Shipping & Insured Delivery</a>
        </li>
        <li class="policy-nav-item {% if active_policy == 'privacy' %}active{% endif %}">
          <a href="/policies/privacy">Privacy & Data Protection</a>
        </li>
        <li class="policy-nav-item {% if active_policy == 'terms' %}active{% endif %}">
          <a href="/policies/terms">Terms of Service</a>
        </li>
      </ul>
    </aside>

    <article class="policy-content-card">
      <div class="policy-header">
        <span class="policy-badge">{{ policy_badge }}</span>
        <h1 class="policy-title">{{ policy_title }}</h1>
        <div class="policy-updated">Nyxeris Customer Protection - Last Revised: September 2026</div>
      </div>

      <div class="policy-body">
        {{ policy_html | safe }}
      </div>
    </article>
  </main>
</body>
</html>
